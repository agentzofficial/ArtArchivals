<script>
    let currentIndex = 0,
        artData = [],
        modalLoadVersion = 0,
        filteredIndices = [],
        currentPage = 1,
        itemsPerPage = 30,
        selectedFilters = {
          type: new Set(),
          characters: new Set(),
          misc: new Set(),
        }
        exactCharacterMatch = false;
        let activeModalIndex = 0;
        let activeVariantIndex = 0;
    
    let pendingFilters = {
      type: new Set(),
      characters: new Set(),
      misc: new Set()
    };

  function matchesFilter(item) {
    const tags = item.tags || [];
    const characters = item.characters || [];

    if (selectedFilters.type.size > 0) {
      let typeMatch = false;

      if (
        selectedFilters.type.has("Renders") &&
        tags.includes("Renders")
      ) typeMatch = true;

      if (
        selectedFilters.type.has("Drawings") &&
        tags.includes("Drawings")
      ) typeMatch = true;

      if (
        selectedFilters.type.has("Other") &&
        tags.includes("Other")
      ) typeMatch = true;

      if (!typeMatch) return false;
    }

    if (selectedFilters.characters.size > 0) {
      const selected = [...selectedFilters.characters];

      if (exactCharacterMatch) {
        const itemSet = new Set(characters);

        const allowedSet = new Set(selected);

        const sameSize = itemSet.size === allowedSet.size;
        const allMatch = [...itemSet].every(c => allowedSet.has(c));

        if (!sameSize || !allMatch) return false;
      } else {
        const charMatch = selected.every(c => characters.includes(c));
        if (!charMatch) return false;
      }
    }

    if (selectedFilters.misc.size > 0) {
      const miscMatch = [...selectedFilters.misc]
        .every(m => tags.includes(m));

      if (!miscMatch) return false;
    }

    return true;
  }

  function getCharacterCount(character) {
    return artData.filter(item =>
      (item.characters || [])
        .includes(character)
    ).length;
  }

  function getTagCount(tag) {
    return artData.filter(item =>
      (item.tags || []).includes(tag)
    ).length;
  }

  const FILTER_TYPES = [
  "Renders",
  "Drawings",
  "Other"
];

  const FILTER_MISC = [
    {
      id: "Star Renders",
      label: "Star Renders",
      info: "Shows the highest quality renders for each year."
    },
    {
      id: "Splatoon Animation Renders",
      label: "Splatoon Animation Renders",
      info: "Show renders related to the main Splatoon Animation Series."
    }
  ];


  function buildFilterMenu() {
    const infoBox = document.getElementById("filter-info-box");

    function setInfo(text) {
      if (!infoBox) return;
      infoBox.textContent = text;
    }
    const typeContainer =
      document.getElementById("type-filters");
    const characterContainer =
      document.getElementById("character-filters");
    const miscContainer =
      document.getElementById("misc-filters");

    typeContainer.innerHTML = "";
    characterContainer.innerHTML = "";
    miscContainer.innerHTML = "";

    FILTER_TYPES.forEach(type => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.dataset.type = type;
      const nameSpan = document.createElement("span");
      nameSpan.textContent = type;

      const countSpan = document.createElement("span");
      countSpan.className = "filter-count";
      countSpan.textContent = ` (${getTagCount(type)})`;
      const infoText =
        type === "Renders"
          ? "Show 3D rendered artwork images."
          : type === "Drawings"
            ? "Show drawn/illustrated artwork."
            : "Show uncategorised images such as screenshots or iconography.";
      label.appendChild(input);
      label.appendChild(nameSpan);
      label.appendChild(countSpan);
      label.addEventListener("mouseenter", () => {
        setInfo(infoText);
      });
      label.addEventListener("mouseleave", () => {
        if (!input.checked) {
          setInfo("Select a filter to see info");
        }
      });
      input.addEventListener("change", () => {
        if (input.checked) {
          setInfo(infoText);
        }
      });
      typeContainer.appendChild(label);
    });

    const PRIORITY_CHARACTERS = [
      "Agent Z",
      "Agent X",
      "Agent 3",
      "Agent 8",
      "Neo Agent 3"
    ];

    const allCharacters = getAllCharacters();

    const priorityChars = PRIORITY_CHARACTERS.filter(c => allCharacters.includes(c));

    const otherChars = allCharacters
      .filter(c => !PRIORITY_CHARACTERS.includes(c))
      .sort((a, b) => a.localeCompare(b));

    function renderCharacterGroup(list) {
      list.forEach(character => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.character = character;
        const nameSpan = document.createElement("span");
        nameSpan.textContent = character;

        const countSpan = document.createElement("span");
        countSpan.className = "filter-count";
        countSpan.textContent = ` (${getCharacterCount(character)})`;

        label.appendChild(input);
        label.appendChild(nameSpan);
        label.appendChild(countSpan);
        const infoText = `Show renders featuring ${character}.`;
        label.addEventListener("mouseenter", () => {
          setInfo(infoText);
        });
        label.addEventListener("mouseleave", () => {
          if (!input.checked) {
            setInfo("Select a filter to see info");
          }
        });
        input.addEventListener("change", () => {
          if (input.checked) {
            setInfo(infoText);
          }
        });
        characterContainer.appendChild(label);
      });
    }

    renderCharacterGroup(priorityChars);

    if (priorityChars.length && otherChars.length) {
      const divider = document.createElement("div");
      divider.className = "filter-divider";
      characterContainer.appendChild(divider);
    }

    renderCharacterGroup(otherChars);

    FILTER_MISC.forEach(misc => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.dataset.misc = misc.id;
      const nameSpan = document.createElement("span");
      nameSpan.textContent = misc.label;

      const countSpan = document.createElement("span");
      countSpan.className = "filter-count";
      countSpan.textContent = ` (${getTagCount(misc.id)})`;

      label.appendChild(input);
      label.appendChild(nameSpan);
      label.appendChild(countSpan);
      const infoText = misc.info;
      label.addEventListener("mouseenter", () => {
        setInfo(infoText);
      });
      label.addEventListener("mouseleave", () => {
        if (!input.checked) {
          setInfo("Select a filter to see info");
        }
      });
      input.addEventListener("change", () => {
        if (input.checked) {
          setInfo(infoText);
        }
      });
      miscContainer.appendChild(label);
    });
  
    document
    .querySelectorAll('#filters-modal input[type="checkbox"]')
    .forEach(box => {
      box.addEventListener("change", updateLiveSelectedCount);
    });

    updateLiveSelectedCount();
  }

  function initializeFilterMenu() {
    const button =
      document.getElementById("filters-button");
    const modal =
      document.getElementById("filters-modal");
    button.addEventListener("click", () => {
      modal.classList.remove("hidden");
    });
    const closeButton =
      document.getElementById("close-filters");

    closeButton.addEventListener("click", () => {
      modal.classList.add("hidden");
    });
      modal.addEventListener("click", (e) => {

      if (e.target === modal) {
        modal.classList.add("hidden");
      }

    });
  }

  function applyFilters() {
    exactCharacterMatch = document.getElementById("exact-character-match").checked;

    pendingFilters.type =
      new Set();
    pendingFilters.characters =
      new Set();
    pendingFilters.misc =
      new Set();

    document
      .querySelectorAll(
        '#type-filters input[type="checkbox"]'
      )
      .forEach(box => {
        if (box.checked) {
          pendingFilters.type.add(
            box.dataset.type
          );
        }
      });

    document
      .querySelectorAll(
        '#character-filters input[type="checkbox"]'
      )
      .forEach(box => {
        if (box.checked) {
          pendingFilters.characters.add(
            box.dataset.character
          );
        }
      });

    document
      .querySelectorAll(
        '#misc-filters input[type="checkbox"]'
      )
      .forEach(box => {
        if (box.checked) {
          pendingFilters.misc.add(
            box.dataset.misc
          );
        }
      });
    selectedFilters = {
      type: new Set(pendingFilters.type),
      characters: new Set(pendingFilters.characters),
      misc: new Set(pendingFilters.misc)
    };
    currentPage = 1;
    renderGallery();
    document
      .getElementById("filters-modal")
      .classList.add("hidden");
  }
  
    const filterBar = document.getElementById("filter-bar");
    const gallery = document.getElementById("gallery");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modal-img");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-description");
    const modalDate = document.getElementById("modal-date");
    const iconsEl = document.querySelector(".modal-icons");
    const navHint = document.querySelector(".navigation-hint");
    const loadHint = document.querySelector(".loading-hint");
  
    let itemNodes = [];
    let selectedYear = 2026;
  
    function buildGallery() {
      gallery.innerHTML = "";
      itemNodes = [];
  
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const visible = filteredIndices.slice(start, end);
  
      const frag = document.createDocumentFragment();
      for (let idx of visible) {
        const item = artData[idx];
        const thumb = (item.variants && item.variants[0]) || item.filename;
        const hasVariants = item.variants && item.variants.length > 1;
  
        const div = document.createElement('div');
        div.className = 'art-item';
        div.innerHTML = `
          <div class="image-container">
            <img class="thumb" loading="lazy"
                 src="/assets/imagesPreview/${thumb.replace(/\.[^/.]+$/, '.webp')}"
                 alt="${item.title.replace(/"/g, '&quot;')}"
                 style="object-position:${item.position || 'center'};">
            ${hasVariants
              ? `<img class="variant-icon"
                      src="{{ '/assets/serverImages/variant-icon.png' | relative_url }}"
                      alt="Has Variants">`
              : ''}
            <div class="overlay">
              <h2>${item.title.replace(/</g, '&lt;')}</h2>
              <p class="date">${item.date || ''}</p>
            </div>
          </div>`;
  
        div.addEventListener('click', () => showModal(idx, 0));
        frag.appendChild(div);
        itemNodes.push(div);
      }
  
      gallery.appendChild(frag);
    }
  
    function updatePaginationControls() {
      const totalPages = Math.ceil(filteredIndices.length / itemsPerPage);
      const container  = document.getElementById('pagination-controls');
      container.innerHTML = '';
  
      if (totalPages <= 1) return;
  
      const prev = document.createElement('button');
      prev.textContent = '‹ Prev';
      prev.disabled    = currentPage === 1;
      prev.onclick     = () => {
        currentPage--;
        renderGallery();
      };
      container.appendChild(prev);
  
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => {
          currentPage = i;
          renderGallery();
        };
        container.appendChild(btn);
      }
  
      const next = document.createElement('button');
      next.textContent = 'Next ›';
      next.disabled    = currentPage === totalPages;
      next.onclick     = () => {
        currentPage++;
        renderGallery();
      };
      container.appendChild(next);
    }

  function updateLiveSelectedCount() {
    const exactCharacterMatch =
      document.getElementById("exact-character-match")?.checked || false;
    const tempFilters = {
      type: new Set(),
      characters: new Set(),
      misc: new Set()
    };

    document.querySelectorAll('#type-filters input[type="checkbox"]').forEach(box => {
      if (box.checked) tempFilters.type.add(box.dataset.type);
    });
    document.querySelectorAll('#character-filters input[type="checkbox"]').forEach(box => {
      if (box.checked) tempFilters.characters.add(box.dataset.character);
    });
    document.querySelectorAll('#misc-filters input[type="checkbox"]').forEach(box => {
      if (box.checked) tempFilters.misc.add(box.dataset.misc);
    });

    const count = artData.filter(item => {
      const tags = item.tags || [];
      const chars = item.characters || [];
      if (tempFilters.type.size > 0) {
        let ok = false;
        if (tempFilters.type.has("Renders") && tags.includes("Renders")) ok = true;
        if (tempFilters.type.has("Drawings") && tags.includes("Drawings")) ok = true;
        if (tempFilters.type.has("Other") && tags.includes("Other")) ok = true;
        if (!ok) return false;
      }
      if (tempFilters.characters.size > 0) {
        const selected = [...tempFilters.characters];

        if (exactCharacterMatch) {
          const itemSet = new Set(chars);
          const allowedSet = new Set(selected);

          const sameSize = itemSet.size === allowedSet.size;
          const allMatch = [...itemSet].every(c => allowedSet.has(c));

          if (!sameSize || !allMatch) return false;
        } else {
          const ok = selected.every(c => chars.includes(c));
          if (!ok) return false;
        }
      }
      if (tempFilters.misc.size > 0) {
        const ok = [...tempFilters.misc].every(m => tags.includes(m));
        if (!ok) return false;
      }
      return true;
    }).length;
    const countEl = document.getElementById("selected-count");
    if (countEl) {
      countEl.textContent = `${count} images selected`;
    }
  }

  function clearAllFilters() {
    document.querySelectorAll('#filters-modal input[type="checkbox"]').forEach(box => {
      box.checked = false;
    });
    selectedFilters = {
      type: new Set(),
      characters: new Set(),
      misc: new Set()
    };
    pendingFilters = {
      type: new Set(),
      characters: new Set(),
      misc: new Set()
    };

    exactCharacterMatch = false;
    document.getElementById("exact-character-match").checked = false;

    currentPage = 1;
    renderGallery();
    updateLiveSelectedCount();
  }

    function updateImageCount() {
      const countEl = document.getElementById("image-count");
      if (countEl) {
        countEl.textContent = `${filteredIndices.length} images`;
      }
    }
  
    let pendingRender = false;
    function renderGallery() {
      if (pendingRender) return;
      pendingRender = true;
  
      requestAnimationFrame(() => {
        filteredIndices = [];
        artData.forEach((item, idx) => {
          const year = new Date(item.date).getFullYear().toString();
          const yearMatch = (selectedYear === 'all' || year === selectedYear);
          const tagMatch = matchesFilter(item);
          if (yearMatch && tagMatch) filteredIndices.push(idx);
        });
  
        buildGallery();
        updatePaginationControls();
        updateImageCount();
        pendingRender = false;
      });
    }
  
    function showModal(index, variantIndex = 0) {
      activeModalIndex = index;
      activeVariantIndex = variantIndex;
      const item     = artData[index];
      if (!item) return;
      currentIndex   = filteredIndices.indexOf(index);
      const variants = item.variants || [item.filename];
      const currentVersion = ++modalLoadVersion;
  
      const previewSrc = `{{ '/assets/imagesPreview/' | relative_url }}${variants[variantIndex].replace(/\.[^/.]+$/, '.webp')}`;
      modalImg.src     = previewSrc;
      modalImg.alt     = item.title;
  
      const vbThumbs = document.querySelector('.variant-thumbs');
      vbThumbs.innerHTML = '';
      if (variants.length > 1) {
        vbThumbs.style.visibility = 'visible';
        vbThumbs.style.pointerEvents = '';
        variants.forEach((fn, i) => {
          const thumb = document.createElement('img');
          thumb.src         = `{{ '/assets/imagesPreview/' | relative_url }}${fn.replace(/\.[^/.]+$/, '.webp')}`;
          thumb.className   = i === variantIndex ? 'active' : '';
          thumb.addEventListener('click', e => {
            e.stopPropagation();
            showModal(index, i);
          });
          vbThumbs.appendChild(thumb);
        });
      } else {
        vbThumbs.style.visibility     = 'hidden';
        vbThumbs.style.pointerEvents  = 'none';
      }
  
      modalTitle.textContent = item.title;
      modalDate.textContent  = item.date        || ''
      const triviaEl = document.getElementById("modal-trivia");

      triviaEl.innerHTML = "";

      (item.trivia || []).forEach(fact => {
        const p = document.createElement("p");
        p.innerHTML = "&bull; " + fact;
        triviaEl.appendChild(p);
      });

      triviaEl.onwheel = function (e) {
        e.preventDefault();
        this.scrollTop += e.deltaY * 0.3;
      };
  
      const actualSrc = `{{ '/assets/images/' | relative_url }}${variants[variantIndex].replace(/\.[^/.]+$/, '.png')}`;
      document.querySelector('.image-wrapper')
              .style.setProperty('--modal-blur-src', `url("${actualSrc}")`);
  
      const actualImg = new Image();
      actualImg.onload = () => {
        if (currentVersion === modalLoadVersion) {
          modalImg.src = actualSrc;
        }
      };
      actualImg.src = actualSrc;
  
      [ -2, -1, 1, 2 ].forEach(offset => {
        const ni = index + offset;
        if (ni >= 0 && ni < artData.length) {
          const fn = (artData[ni].variants?.[0] || artData[ni].filename)
                       .replace(/\.[^/.]+$/, '.png');
          new Image().src = `{{ '/assets/images/' | relative_url }}${fn}`;
        }
      });
  
      iconsEl.innerHTML = '';
      if (item.youtube) iconsEl.innerHTML +=
        `<a href="${item.youtube}" target="_blank" class="source-icon">
           <img src="{{ '/assets/serverImages/youtube-icon.png' | relative_url }}" alt="YouTube">
         </a>`;
      if (item.twitter) iconsEl.innerHTML +=
        `<a href="${item.twitter}" target="_blank" class="source-icon">
           <img src="{{ '/assets/serverImages/twitter-icon.png' | relative_url }}" alt="Twitter">
         </a>`;
      if (item.bluesky) iconsEl.innerHTML +=
        `<a href="${item.bluesky}" target="_blank" class="source-icon">
           <img src="{{ '/assets/serverImages/bluesky-icon.png' | relative_url }}" alt="Bluesky">
         </a>`;
  
      modal.style.display    = 'flex';
      loadHint.style.display = 'block';
      navHint.style.display  = 'block';
      document.body.classList.add("modal-open");
      lockNavForModal(true);
    }

    const saveBtn = document.getElementById("save-image-btn");
    const viewFullBtn = document.getElementById("view-full-btn");

    saveBtn.onclick = () => {
      const item = artData[activeModalIndex];
      const variants = item.variants || [item.filename];
      const variant = variants[activeVariantIndex];

      const link = document.createElement("a");
      link.href = `{{ '/assets/images/' | relative_url }}${variant}`;
      link.download = variant;

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    function lockNavForModal(isOpen) {
      const nav = document.querySelector(".new-desktop-nav");
      const panel = document.getElementById("navPanel");
      const button = document.getElementById("navToggle");

      if (isOpen) {
        nav.classList.add("nav-hidden");   // force hide
        panel.classList.remove("open");    // close dropdown
        button.textContent = "Navigate ▾"; // reset label
      }
    }

    function getAllCharacters() {
      const chars = new Set();

      artData.forEach(item => {
        (item.characters || []).forEach(char => {
          chars.add(char);
        });
      });

      return [...chars].sort();
    }
  
    function buildYearNav() {
      const yearsSet = new Set(
        artData.map(item => new Date(item.date).getFullYear().toString())
      );
      const years = Array.from(yearsSet)
        .sort((a, b) => parseInt(b) - parseInt(a));
  
      years.unshift('all');
  
      const html = years.map(y =>
        `<button data-year="${y}" class="${y === selectedYear ? 'selected' : ''}">`
          + (y === 'all' ? 'All' : y) +
        `</button>`
      ).join('');
  
      document.getElementById('year-nav').innerHTML = html;
      document.getElementById('year-nav-bottom').innerHTML = html;
  
      document.querySelectorAll('.year-nav button').forEach(btn => {
        btn.onclick = () => {
          selectedYear = btn.dataset.year;
          currentPage = 1;
          buildYearNav();
          renderGallery();
        };
      });
    }
  
    function schedulePreload() {
      const preloadList = itemNodes
        .map((node, idx) => matchesFilter(artData[idx]) ? artData[idx] : null)
        .filter(Boolean);
  
      let index = 0;
      const preloadNext = () => {
        if (index >= preloadList.length) return;
        const item = preloadList[index++];
        const filename = item.variants?.[0] || item.filename;
        const img = new Image();
        img.onload = preloadNext;
        img.src = `{{ '/assets/images/' | relative_url }}${filename.replace(/\.[^/.]+$/, '.png')}`;
      };
      preloadNext();
    }
  
    function loadAllYears() {
      const years = [2026, 2025, 2024, 2023];
      const dataPrefix = `{{ '/assets/data/' | relative_url }}`;
  
      return Promise.all(
        years.map(y =>
          fetch(dataPrefix + `${y}.json`).then(r => r.json())
        )
      ).then(arrays => arrays.flat());
    }
  
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById("clear-filters-modal").addEventListener("click", clearAllFilters);
      document.getElementById("clear-filters-top").addEventListener("click", clearAllFilters);
      selectedYear = '2026';
      loadAllYears()
        .then(data => {
          artData = data;
          buildFilterMenu();
          initializeFilterMenu();

          document
            .getElementById("apply-filters")
            .addEventListener(
              "click",
              applyFilters
            );

          buildGallery();
          buildYearNav();
          renderGallery();
        })
        .catch(err => console.error(err));
    });
</script>

<script>
  (() => {

    const viewer = document.getElementById("image-viewer");
    const stage = document.getElementById("viewer-stage");
    const img = document.getElementById("viewer-image");
    const closeBtn = document.getElementById("viewer-close");
    const viewBtn = document.getElementById("view-full-btn");
    img.draggable = false;

    let scale = 1;
    let x = 0;
    let y = 0;

    let dragging = false;
    let startX = 0;
    let startY = 0;

    const MIN_SCALE = 0.1;
    const MAX_SCALE = 6;

    function updateTransform() {
        img.style.transform =
            `translate(${x}px, ${y}px) scale(${scale})`;
    }

    function clampScale() {
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));

        if (scale === 1) {
            x = 0;
            y = 0;
        }
    }

    function resetView() {
        scale = 1;
        x = 0;
        y = 0;
        updateTransform();
    }

    function openViewer(src) {
        img.src = src;
        resetView();
        viewer.classList.remove("hidden");
    }

    function closeViewer() {
        viewer.classList.add("hidden");
        img.src = "";
    }

    viewBtn.addEventListener("click", () => {
        const item = artData[activeModalIndex];
        const variants = item.variants || [item.filename];

        openViewer(
            `{{ '/assets/images/' | relative_url }}${variants[activeVariantIndex]}`
        );
    });

    img.addEventListener("dragstart", e => {
        e.preventDefault();
    });

    stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = stage.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        const prevScale = scale;
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * zoomFactor));
        const scaleDiff = scale / prevScale;
        x = x - dx * (scaleDiff - 1);
        y = y - dy * (scaleDiff - 1);
        updateTransform();
    }, { passive: false });

    stage.addEventListener("pointerdown", e => {
        e.preventDefault();
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        img.style.cursor = "grabbing";
    });
    stage.addEventListener("pointermove", e => {
        if (!dragging) return;
        x += e.clientX - startX;
        y += e.clientY - startY;
        startX = e.clientX;
        startY = e.clientY;
        updateTransform();
    });
    stage.addEventListener("pointerup", () => {
        dragging = false;
        img.style.cursor = "grab";
    });
    stage.addEventListener("pointercancel", () => {
        dragging = false;
        img.style.cursor = "grab";
    });

    closeBtn.addEventListener("click", closeViewer);
    viewer.addEventListener("click", e => {
        if (e.target === viewer) {
            closeViewer();
        }
    });

    <script>
    const modalElement = document.getElementById("modal");

        navHint.style.display = "none";
        document.body.classList.remove("modal-open");
        lockNavForModal(false);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!document.body.classList.contains("modal-open")) return;
      const viewer = document.getElementById("image-viewer");
      if (viewer && !viewer.classList.contains("hidden")) return;
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" &&
          e.key !== "a" && e.key !== "d") return;
      const isLeft = (e.key === "ArrowLeft" || e.key === "a");
      const isRight = (e.key === "ArrowRight" || e.key === "d");
      if (isLeft && currentIndex > 0) {
        currentIndex--;
        showModal(filteredIndices[currentIndex], 0);
      }
      if (isRight && currentIndex < filteredIndices.length - 1) {
        currentIndex++;
        showModal(filteredIndices[currentIndex], 0);
      }
    });

    document.querySelector(".modal-side-btn.left").addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        showModal(filteredIndices[currentIndex], 0);
      }
    });

    document.querySelector(".modal-side-btn.right").addEventListener("click", () => {
      if (currentIndex < filteredIndices.length - 1) {
        currentIndex++;
        showModal(filteredIndices[currentIndex], 0);
      }
    });
    
    let touchStartX = null;
    let touchStartY = null;
    
    frame.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    });
  
    frame.addEventListener("touchend", (e) => {
      if (touchStartX === null || e.changedTouches.length !== 1) {
        touchStartX = null;
        return;
      }
      const touchEndX = e.changedTouches[0].clientX;
      const dx = touchEndX - touchStartX;
      const SWIPE_THRESHOLD = 50;

      const currentImg = document.getElementById("modal-img");
  
      if (dx > SWIPE_THRESHOLD && currentIndex > 0) {
        showModal(filteredIndices[currentIndex - 1], 0);
      }
      else if (dx < -SWIPE_THRESHOLD && currentIndex < filteredIndices.length - 1) {
        showModal(filteredIndices[currentIndex + 1], 0);
      }
  
      touchStartX = null;
    });
  
    frame.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && touchStartX !== null) {
        const touch = e.touches[0];
        const dx = Math.abs(touch.clientX - touchStartX);
        const dy = Math.abs(touch.clientY - touchStartY || 0);
        if (dx > 10 && dx > dy) {
          e.preventDefault();
        }
      }
    });

  <script>
    // NEWS
    document.addEventListener('DOMContentLoaded', () => {
      const BASE_URL = "{{ site.baseurl | default: '' }}";
      fetch('/assets/data/news.json')
        .then(r => r.json())
        .then(newsArray => {
          newsArray.sort((a, b) => new Date(b.date) - new Date(a.date));
          const latestFour = newsArray.slice(0, 4);
  
          const grid = document.querySelector('.news-grid');
          latestFour.forEach(item => {
            const card       = document.createElement('a');
            card.href = `news/news-${item.date.replace(/-/g, '-')}_1/`;
            card.className   = 'news-card';
    
            const d          = new Date(item.date);
            const formatted  = d.toLocaleDateString('en-GB', {
              day:   'numeric',
              month: 'long',
              year:  'numeric'
            });
        
            // build the inner HTML once
            card.innerHTML = `
              <img src="${BASE_URL}${item.thumbnail}" class="news-thumb"/>
              <span class="news-tag">${item.tag}</span>
              <h3 class="news-title">${item.title}</h3>
              <time class="news-date">${formatted}</time>
            `;
        
            grid.appendChild(card);
          });
        })
        .catch(err => console.error('Failed to load news:', err));
    });
  </script>
